<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval';">
<link rel="stylesheet" href="../media/sprite.css">
<title>Editor de sprites</title>
</head>
<body style="width: 900px; height: 600px">
<div id="error" role="alert"></div>
<div id="layout">
  <div id="toolbar" role="toolbar" aria-label="Herramientas"></div>
  <div id="canvas-pane"><canvas id="grid" tabindex="0" aria-label="Fotograma"></canvas></div>
  <div id="side">
    <section id="palette-pane" aria-label="Colores"></section>
    <section id="size-pane" aria-label="Tamaño y tipo"></section>
    <section id="anim-pane" aria-label="Animar"></section>
    <section id="amiga-pane" aria-label="Ver en Amiga"></section>
  </div>
  <div id="frames" role="listbox" aria-label="Fotogramas"></div>
  <div id="status" role="status" aria-live="polite"></div>
</div>
<script src="../media/iff.js"></script>
<script src="../media/spriteModel.js"></script>
<script src="../media/sprite.js"></script>
</body>
</html>
